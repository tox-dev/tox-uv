[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.28",
]

[project]
name = "tox-uv"
import-names = [ "tox_uv_meta" ]
description = "Integration of uv with tox (meta package with bundled uv)."
keywords = [
  "integration",
  "tox",
  "uv",
]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "tox-uv-bare",
  "uv<1,>=0.9.27",
]
urls.Changelog = "https://github.com/tox-dev/tox-uv/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/tox-dev/tox-uv#tox-uv"
urls.Homepage = "https://github.com/tox-dev/tox-uv"
urls.Source = "https://github.com/tox-dev/tox-uv"
urls.Tracker = "https://github.com/tox-dev/tox-uv/issues"

[tool.hatch]
version.source = "vcs"
version.raw-options.root = ".."
metadata.hooks.custom.path = "hatch_build.py"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "../README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    (?<!!)\[(?P<label>[^\]]+)\]\( # Link text, excluding images
    (?P<path>CHANGELOG\.md|CONTRIBUTING\.md) # Repository files linked from the README
    \)
    ''', replacement = '[\g<label>](https://github.com/tox-dev/tox-uv/blob/main/\g<path>)' },
]
build.targets.wheel.force-include."__init__.py" = "tox_uv_meta/__init__.py"

[tool.uv]
sources.tox-uv-bare = { workspace = true }
