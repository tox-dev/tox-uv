[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
]

[project]
name = "tox-uv-bare"
import-names = [ "tox_uv" ]
description = "Integration of uv with tox (bare package, bring your own uv)."
keywords = [
  "integration",
  "tox",
  "uv",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Topic :: System",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "packaging>=26.3",
  "tox<5,>=4.64.7",
]
urls.Changelog = "https://github.com/tox-dev/tox-uv/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/tox-dev/tox-uv#tox-uv"
urls.Homepage = "https://github.com/tox-dev/tox-uv"
urls.Source = "https://github.com/tox-dev/tox-uv"
urls.Tracker = "https://github.com/tox-dev/tox-uv/issues"
entry-points.tox.tox-uv = "tox_uv.plugin"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "devpi-process>=1.2",
  "diff-cover>=10.6",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
]
type = [ "ty>=0.0.84", { include-group = "pkg-meta" }, { include-group = "test" } ]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
  "setuptools>=80",
]
lint = [ "pre-commit-uv>=4.3" ]
pkg-meta = [ "check-wheel-contents>=0.6.3", "twine>=7", "uv>=0.12.22" ]
release-news = [
  "release-creator>=4.4",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=4.4",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.4",
  "towncrier>=26.9",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    (?<!!)\[(?P<label>[^\]]+)\]\( # Link text, excluding images
    (?P<path>CHANGELOG\.md|CONTRIBUTING\.md) # Repository files linked from the README
    \)
    ''', replacement = '[\g<label>](https://github.com/tox-dev/tox-uv/blob/main/\g<path>)' },
]
build.hooks.vcs.version-file = "src/tox_uv/version.py"
build.hooks.python-sbom = {}
build.targets.wheel.packages = [ "src/tox_uv" ]
build.targets.sdist.include = [
  "/src",
  "/tests",
]

[tool.uv]
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }
workspace.members = [ "meta" ]

[tool.ruff]
line-length = 120
fix = true
unsafe-fixes = true
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # No copyright statements
  "docstring-missing-exception",               # rst-missing-raises (simplint) reads reST fields instead
  "docstring-missing-returns",                 # no support for sphinx
  "docstring-missing-yields",                  # rst-returns (simplint) reads reST fields instead
  "incorrect-blank-line-before-class",         # incompatible with blank-line-before-class
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # multi-line summaries start on the next line
  "single-line-implicit-string-concatenation", # Conflict with formatter
  "undocumented-magic-method",                 # function-docstring and undocumented-public-api own class and function documentation to avoid conflicting fixes
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-nested-class",
]
lint.per-file-ignores."meta/tests/**/*.py" = [
  "assert",                     # asserts allowed in tests...
  "implicit-namespace-package", # no implicit namespace
  "undocumented-public-module", # test modules do not need docstrings
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                      # asserts allowed in tests...
  "implicit-namespace-package",  # no implicit namespace
  "undocumented-public-module",  # test modules do not need docstrings
  "undocumented-public-package", # test fixture packages do not need docstrings
]
lint.isort = { known-first-party = [
  "tox_uv",
  "tests",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
write-changes = true
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.pytest]
ini_options.norecursedirs = "tests/data/*"
ini_options.verbosity_assertions = 2

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
run.patch = [ "subprocess" ]
paths.other = [
  ".",
  "*/tox_uv",
  "*\\tox_uv",
]
paths.source = [
  "src",
  ".tox/*/lib/*/site-packages",
  ".tox\\*\\Lib\\site-packages",
  "**/src",
  "**\\src",
]
report.fail_under = 100
report.omit = [
  "src/tox_uv/_venv_query.py",
]
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "tox-uv"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.python-sbom]
supplier = { name = "tox-dev", url = [ "https://github.com/tox-dev" ] }

[tool.nab]
mode = "universal"
base-group = "project-runtime"
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64" ]
# release-creator 4.4.0 needs a seven-day cutoff exception.
# expires 2026-11-16
packages.release-creator.uploaded-prior-to = 2026-11-02T21:45:00Z
# python-sbom 0.1.2 needs a seven-day cutoff exception.
# expires 2026-11-15
packages.python-sbom.uploaded-prior-to = 2026-11-08T17:54:00Z

[tool.simplint]
docstring-style = "rst"
