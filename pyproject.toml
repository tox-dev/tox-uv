[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
]

[project]
name = "tox-uv-bare"
description = "Integration of uv with tox (bare package, bring your own uv)."
readme = "README.md"
keywords = [
  "environments",
  "isolated",
  "testing",
  "virtual",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries",
  "Topic :: System",
]
dynamic = [
  "version",
]
dependencies = [
  "packaging>=26.3",
  "tox<5,>=4.64.7",
]
urls.Changelog = "https://github.com/tox-dev/tox-uv/releases"
urls.Documentation = "https://github.com/tox-dev/tox-uv#tox-uv"
urls.Homepage = "https://github.com/tox-dev/tox-uv"
urls.Source = "https://github.com/tox-dev/tox-uv"
urls.Tracker = "https://github.com/tox-dev/tox-uv/issues"
entry-points.tox.tox-uv = "tox_uv.plugin"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "devpi-process>=1.2",
  "diff-cover>=10.6",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
]
type = [ "ty>=0.0.84", { include-group = "pkg-meta" }, { include-group = "test" } ]
lint = [ "pre-commit-uv>=4.3" ]
pkg-meta = [ "check-wheel-contents>=0.6.3", "twine>=7", "uv>=0.12.22" ]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/tox_uv/version.py"
build.targets.wheel.packages = [ "src/tox_uv" ]
build.targets.sdist.include = [
  "/src",
  "/tests",
]

[tool.ruff]
line-length = 120
fix = true
unsafe-fixes = true
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # No copyright statements
  "D",                                         # no documentation for now
  "docstring-missing-returns",                 # no support for sphinx
  "escape-sequence-in-docstring",              # Use `r"""` if any backslashes in a docstring
  "hardcoded-bind-all-interfaces",             # Possible binding to all interface
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "missing-blank-line-after-summary",          # 1 blank line required between summary line and description
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "non-imperative-mood",                       # First line of docstring should be in imperative mood
  "single-line-implicit-string-concatenation", # Conflict with formatter
]
lint.per-file-ignores."meta/tests/**/*.py" = [
  "assert",                     # asserts allowed in tests...
  "D",                          # don't care about documentation in tests
  "FBT",                        # don't care about booleans as positional arguments in tests
  "implicit-namespace-package", # no implicit namespace
  "import-private-name",        # private import is fine
  "magic-value-comparison",     # Magic value used in comparison, consider replacing with a constant variable
  "S",                          # no safety concerns
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                     # asserts allowed in tests...
  "D",                          # don't care about documentation in tests
  "FBT",                        # don't care about booleans as positional arguments in tests
  "implicit-namespace-package", # no implicit namespace
  "import-private-name",        # private import is fine
  "magic-value-comparison",     # Magic value used in comparison, consider replacing with a constant variable
  "pytest-fixture-autouse",     # shared setup fixtures are meant to apply to every test
  "S",                          # no safety concerns
]
lint.isort = { known-first-party = [
  "tox_uv",
  "tests",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
write-changes = true
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
src.exclude = [ "meta" ]
environment.python-version = "3.15"

[tool.pytest]
ini_options.norecursedirs = "tests/data/*"
ini_options.verbosity_assertions = 2

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
run.patch = [ "subprocess" ]
paths.other = [
  ".",
  "*/tox_uv",
  "*\\tox_uv",
]
paths.source = [
  "src",
  ".tox/*/lib/*/site-packages",
  ".tox\\*\\Lib\\site-packages",
  "**/src",
  "**\\src",
]
report.fail_under = 100
report.omit = [
  "src/tox_uv/_venv_query.py",
]
html.show_contexts = true
html.skip_covered = false
