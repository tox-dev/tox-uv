name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "51 7 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: 🧪 Test
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      tox-install: tox --with .
      exclude-newer-package: python-sbom=2026-11-08T17:54:00Z
      include: |
        [
          {"env": "3.15", "python": "3.15"},
          {"env": "3.15t", "python": "3.15t"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "type"},
          {"env": "dev"},
          {"env": "pkg_meta"},
          {"env": "3.15", "os": "windows-2025-vs2026", "python": "cpython-3.15-windows-x86_64-none"},
          {"env": "3.15", "os": "macos-26", "python": "cpython-3.15-macos-aarch64-none"},
          {"env": "meta-3.15", "python": "3.15"},
          {"env": "meta-3.14", "python": "3.14"},
          {"env": "meta-3.13", "python": "3.13"},
          {"env": "meta-3.12", "python": "3.12"},
          {"env": "meta-3.11", "python": "3.11"}
        ]
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, release, hooks]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@6.8.0
        with:
          needs: ${{ toJSON(needs) }}
