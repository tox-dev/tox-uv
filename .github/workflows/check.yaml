name: check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-26.04' }}
    name: ${{ matrix.env }}${{ matrix.suffix || ''}}
    strategy:
      fail-fast: false
      matrix:
        env:
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - type
          - dev
          - pkg_meta
        os:
          - ubuntu-26.04
        suffix:
          - "-linux-x86_64-gnu"
        include:
          - env: "3.15"
            os: windows-2025-vs2026
            suffix: -windows-x86_64-msvc
          - env: "3.15"
            os: macos-26
            suffix: -macos-aarch64-none
          - env: "3.15"
            os: macos-26
            suffix: -macos-x86_64-none
          - env: meta-3.15
          - env: meta-3.14
          - env: meta-3.13
          - env: meta-3.12
          - env: meta-3.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with .
      - name: Install Python
        if: startsWith(matrix.env, '3.') || startsWith(matrix.env, 'meta-')
        shell: bash
        env:
          MATRIX_ENV: ${{ matrix.env }}
          MATRIX_SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION="$MATRIX_ENV"
          VERSION="${VERSION#meta-}"

          case "$VERSION" in
          *-arm64-* | *-arm64 | *-x86_64-* | *-x86_64) UV_VERSION="cpython-$VERSION" ;;
          *)
            UV_VERSION="cpython-$VERSION${MATRIX_SUFFIX}"
            if [[ "$UV_VERSION" == *-msvc ]]; then
              UV_VERSION="${UV_VERSION%-msvc}-none"
            fi
            ;;
          esac

          uv python install --python-preference only-managed "$UV_VERSION"
      - name: Setup test suite
        env:
          MATRIX_ENV: ${{ matrix.env }}
          FORCE_COLOR: "1"
          UV_PYTHON_PREFERENCE: "only-managed"
        run: tox run -vv --notest --skip-missing-interpreters false -e "$MATRIX_ENV"
      - name: Run test suite
        env:
          MATRIX_ENV: ${{ matrix.env }}
          FORCE_COLOR: "1"
          PYTEST_ADDOPTS: "-vv --durations=20"
          DIFF_AGAINST: HEAD
          UV_PYTHON_PREFERENCE: "only-managed"
        run: tox run --skip-pkg-install -e "$MATRIX_ENV"
  hook-cooldown:
    name: Hook update cooldown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@74472c1a3602ca9b66db058ea31578865e1d208b
        env:
          GH_TOKEN: ${{ github.token }}
  gate:
    name: Required checks pass
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, hook-cooldown]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(
              to_entries[];
              .value.result == "success" or
              ((.key == "hook-cooldown") and .value.result == "skipped" and $event != "pull_request")
            )
          ' <<<"$NEEDS_JSON"
