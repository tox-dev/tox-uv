name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "51 7 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: 🧪 Test
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
    permissions:
      contents: read
    with:
      tox-install: tox --with .
      include: |
        [
          {"env": "3.15", "python": "3.15"},
          {"env": "3.15t", "python": "3.15t"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "type"},
          {"env": "dev"},
          {"env": "pkg_meta"},
          {"env": "3.15", "os": "windows-2025-vs2026", "python": "cpython-3.15-windows-x86_64-none"},
          {"env": "3.15", "os": "macos-26", "python": "cpython-3.15-macos-aarch64-none"},
          {"env": "meta-3.15", "python": "3.15"},
          {"env": "meta-3.14", "python": "3.14"},
          {"env": "meta-3.13", "python": "3.13"},
          {"env": "meta-3.12", "python": "3.12"},
          {"env": "meta-3.11", "python": "3.11"}
        ]
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
        with:
          needs: ${{ toJSON(needs) }}
