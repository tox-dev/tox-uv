name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-26.04' }}
    name: 🧪 ${{ matrix.env }}${{ matrix.suffix || ''}}
    strategy:
      fail-fast: false
      matrix:
        env:
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - type
          - dev
          - pkg_meta
        os:
          - ubuntu-26.04
        suffix:
          - "-linux-x86_64-gnu"
        include:
          - env: "3.15"
            os: windows-2025-vs2026
            suffix: -windows-x86_64-msvc
          - env: "3.15"
            os: macos-26
            suffix: -macos-aarch64-none
          - env: "3.15"
            os: macos-26
            suffix: -macos-x86_64-none
          - env: meta-3.15
          - env: meta-3.14
          - env: meta-3.13
          - env: meta-3.12
          - env: meta-3.11
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with .
      - name: 🐍 Install Python
        if: startsWith(matrix.env, '3.') || startsWith(matrix.env, 'meta-')
        shell: bash
        env:
          MATRIX_ENV: ${{ matrix.env }}
          MATRIX_SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION="$MATRIX_ENV"
          VERSION="${VERSION#meta-}"

          case "$VERSION" in
          *-arm64-* | *-arm64 | *-x86_64-* | *-x86_64) UV_VERSION="cpython-$VERSION" ;;
          *)
            UV_VERSION="cpython-$VERSION${MATRIX_SUFFIX}"
            if [[ "$UV_VERSION" == *-msvc ]]; then
              UV_VERSION="${UV_VERSION%-msvc}-none"
            fi
            ;;
          esac

          uv python install --python-preference only-managed "$UV_VERSION"
      - name: 📦 Set up test suite
        env:
          MATRIX_ENV: ${{ matrix.env }}
          FORCE_COLOR: "1"
          UV_PYTHON_PREFERENCE: "only-managed"
        run: tox run -vv --notest --skip-missing-interpreters false -e "$MATRIX_ENV"
      - name: 🧪 Run test suite
        env:
          MATRIX_ENV: ${{ matrix.env }}
          FORCE_COLOR: "1"
          PYTEST_ADDOPTS: "-vv --durations=20"
          DIFF_AGAINST: HEAD
          UV_PYTHON_PREFERENCE: "only-managed"
        run: tox run --skip-pkg-install -e "$MATRIX_ENV"
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all needed jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(to_entries[]; .value.result == "success")' <<<"$NEEDS_JSON"
