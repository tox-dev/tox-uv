name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@5e11f2254a4dcb7102747d312ad7db48a2e9b0cb
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      changelog: CHANGELOG.md
      fragments: changelog.d
      format: markdown
