name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-bare:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
    permissions:
      contents: read
    with:
      source: .
      artifact-prefix: bare-
  build-meta:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
    permissions:
      contents: read
    with:
      source: meta
      artifact-prefix: meta-
  collect:
    name: Collect validated distributions
    needs: [build-bare, build-meta]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bare-python-package-distributions
          path: bare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-python-package-distributions
          path: meta
      - name: Check the package set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(find bare -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find meta -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find bare -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test "$(find meta -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test -f "bare/tox_uv_bare-${TAG}.tar.gz"
          test -f "meta/tox_uv-${TAG}.tar.gz"
          test "$(find bare -maxdepth 1 -type f -name "tox_uv_bare-${TAG}-*.whl" | wc -l)" -eq 1
          test "$(find meta -maxdepth 1 -type f -name "tox_uv-${TAG}-*.whl" | wc -l)" -eq 1
      - name: Collect the published files
        run: |
          mkdir dist
          cp bare/* dist/
          cp meta/*.whl dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
  previous-tag:
    name: Find previous release
    needs: collect
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Select previous tag
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        with:
          tag: ${{ github.ref_name }}
  contributor-metadata:
    name: Generate contributor notes
    needs: previous-tag
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write # GitHub's generated-notes API requires Contents write.
    steps:
      - name: Fetch contributor metadata
        if: needs.previous-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.tag }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f previous_tag_name="$PREVIOUS" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Fetch first-release contributor metadata
        if: needs.previous-tag.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  github-notes:
    name: Render GitHub Release notes
    needs: [contributor-metadata, previous-tag]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        with:
          tag: ${{ github.ref_name }}
          previous: ${{ needs.previous-tag.outputs.tag }}
          changelog: CHANGELOG.md
          artifact-url: https://pypi.org/project/tox-uv/${{ github.ref_name }}/
          artifact-label: "PyPI: tox-uv"
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Add the bare distribution link
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            index($0, "**Full Changelog**:") == 1 { print "[PyPI: tox-uv-bare](https://pypi.org/project/tox-uv-bare/" tag "/)\n" }
            { print }
          ' "$RUNNER_TEMP/release-notes.md" >"$RUNNER_TEMP/release-notes-with-bare.md"
          mv "$RUNNER_TEMP/release-notes-with-bare.md" "$RUNNER_TEMP/release-notes.md"
      - name: Check both distribution links
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -Fq "[PyPI: tox-uv](https://pypi.org/project/tox-uv/${TAG}/)" "$RUNNER_TEMP/release-notes.md"
          grep -Fq "[PyPI: tox-uv-bare](https://pypi.org/project/tox-uv-bare/${TAG}/)" "$RUNNER_TEMP/release-notes.md"
          test "$(grep -Fc '**Full Changelog**:' "$RUNNER_TEMP/release-notes.md")" -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  github-draft:
    name: Stage GitHub Release
    needs: github-notes
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - uses: tox-dev/github-workflows/publish-github-release@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: stage
  release:
    name: Publish to PyPI
    needs:
      - collect
      - github-draft
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox-uv/${{ github.ref_name }}
    permissions:
      id-token: write # Publish through PyPI's trusted publisher.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
  verify-pypi:
    name: Verify both PyPI distributions
    needs:
      - release
      - github-draft
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Separate the PyPI project files
        run: |
          mkdir bare meta
          cp dist/tox_uv_bare-*.whl dist/tox_uv_bare-*.tar.gz bare/
          cp dist/tox_uv-*.whl meta/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        with:
          project: tox-uv-bare
          version: ${{ github.ref_name }}
          dist: bare
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        with:
          project: tox-uv
          version: ${{ github.ref_name }}
          dist: meta
  github-release:
    name: Publish GitHub Release
    needs: [verify-pypi, github-notes, github-draft]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write # Create or repair the GitHub Release after PyPI succeeds.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - uses: tox-dev/github-workflows/publish-github-release@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: publish
