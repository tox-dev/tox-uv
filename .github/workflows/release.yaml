name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
jobs:
  build-bare:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@5e11f2254a4dcb7102747d312ad7db48a2e9b0cb
    permissions:
      contents: read
    with:
      changelog: CHANGELOG.md
      fragments: changelog.d
      format: markdown
      source: .
      artifact-prefix: bare-
      artifact-base-url: https://pypi.org/project/tox-uv-bare/
      artifact-label: "PyPI: tox-uv-bare"
  build-meta:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@5e11f2254a4dcb7102747d312ad7db48a2e9b0cb
    permissions:
      contents: read
    with:
      changelog: CHANGELOG.md
      fragments: changelog.d
      format: markdown
      source: meta
      artifact-prefix: meta-
      artifact-base-url: https://pypi.org/project/tox-uv/
      artifact-label: "PyPI: tox-uv"
  collect:
    needs: [build-bare, build-meta]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bare-python-package-distributions
          path: bare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-python-package-distributions
          path: meta
      - name: Check the package set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(find bare -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find meta -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find bare -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test "$(find meta -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test -f "bare/tox_uv_bare-${TAG}.tar.gz"
          test -f "meta/tox_uv-${TAG}.tar.gz"
          test "$(find bare -maxdepth 1 -type f -name "tox_uv_bare-${TAG}-*.whl" | wc -l)" -eq 1
          test "$(find meta -maxdepth 1 -type f -name "tox_uv-${TAG}-*.whl" | wc -l)" -eq 1
      - name: Collect the published files
        run: |
          mkdir dist
          cp bare/* dist/
          cp meta/*.whl dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked package checks
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Check distribution metadata
        run: twine check bare/* meta/*
      - name: Check wheel contents
        run: check-wheel-contents --no-config bare/*.whl meta/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  previous-tag:
    needs: collect
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Select previous tag
        id: previous
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          echo "tag=$previous" >>"$GITHUB_OUTPUT"
  contributor-metadata:
    needs: previous-tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        if: needs.previous-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.tag }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f previous_tag_name="$PREVIOUS" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Fetch first-release contributor metadata
        if: needs.previous-tag.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
          retention-days: 1
  github-notes:
    needs: contributor-metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@5e11f2254a4dcb7102747d312ad7db48a2e9b0cb
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          repository: ${{ github.repository }}
          artifact-url: https://pypi.org/project/tox-uv/${{ github.ref_name }}/
          artifact-label: "PyPI: tox-uv"
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Add the bare distribution link
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            index($0, "**Full Changelog**:") == 1 { print "[PyPI: tox-uv-bare](https://pypi.org/project/tox-uv-bare/" tag "/)\n" }
            { print }
          ' "$RUNNER_TEMP/release-notes.md" >"$RUNNER_TEMP/release-notes-with-bare.md"
          mv "$RUNNER_TEMP/release-notes-with-bare.md" "$RUNNER_TEMP/release-notes.md"
      - name: Check both distribution links
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -Fq "[PyPI: tox-uv](https://pypi.org/project/tox-uv/${TAG}/)" "$RUNNER_TEMP/release-notes.md"
          grep -Fq "[PyPI: tox-uv-bare](https://pypi.org/project/tox-uv-bare/${TAG}/)" "$RUNNER_TEMP/release-notes.md"
          test "$(grep -Fc '**Full Changelog**:' "$RUNNER_TEMP/release-notes.md")" -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [collect, github-notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox-uv/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
  github-release:
    needs: [release, github-notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/github-release-notes/release-notes.md"
