name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-bare:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
    permissions:
      contents: read
    with:
      changelog: CHANGELOG.md
      source: .
      artifact-prefix: bare-
      artifact-base-url: https://pypi.org/project/tox-uv-bare/
      artifact-label: "PyPI: tox-uv-bare"
  build-meta:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
    permissions:
      contents: read
    with:
      changelog: CHANGELOG.md
      source: meta
      artifact-prefix: meta-
      artifact-base-url: https://pypi.org/project/tox-uv/
      artifact-label: "PyPI: tox-uv"
  collect:
    name: Validate both distributions
    needs: [build-bare, build-meta]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bare-python-package-distributions
          path: bare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-python-package-distributions
          path: meta
      - name: Check the package set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(find bare -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find meta -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find bare -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test "$(find meta -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test -f "bare/tox_uv_bare-${TAG}.tar.gz"
          test -f "meta/tox_uv-${TAG}.tar.gz"
          test "$(find bare -maxdepth 1 -type f -name "tox_uv_bare-${TAG}-*.whl" | wc -l)" -eq 1
          test "$(find meta -maxdepth 1 -type f -name "tox_uv-${TAG}-*.whl" | wc -l)" -eq 1
      - name: Collect the published files
        run: |
          mkdir dist
          cp bare/* dist/
          cp meta/*.whl dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked package checks
        uses: tox-dev/github-workflows/install-locked-tools@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Check distribution metadata
        run: twine check bare/* meta/*
      - name: Check wheel contents
        run: check-wheel-contents --no-config bare/*.whl meta/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
  previous-tag:
    name: Find previous release
    needs: collect
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Select previous tag
        id: previous
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          echo "tag=$previous" >>"$GITHUB_OUTPUT"
  contributor-metadata:
    name: Generate contributor notes
    needs: previous-tag
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write # GitHub's generated-notes API requires Contents write.
    steps:
      - name: Fetch contributor metadata
        if: needs.previous-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.tag }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f previous_tag_name="$PREVIOUS" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Fetch first-release contributor metadata
        if: needs.previous-tag.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  github-notes:
    name: Render GitHub Release notes
    needs: contributor-metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          repository: ${{ github.repository }}
          artifact-url: https://pypi.org/project/tox-uv/${{ github.ref_name }}/
          artifact-label: "PyPI: tox-uv"
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Add the bare distribution link
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            index($0, "**Full Changelog**:") == 1 { print "[PyPI: tox-uv-bare](https://pypi.org/project/tox-uv-bare/" tag "/)\n" }
            { print }
          ' "$RUNNER_TEMP/release-notes.md" >"$RUNNER_TEMP/release-notes-with-bare.md"
          mv "$RUNNER_TEMP/release-notes-with-bare.md" "$RUNNER_TEMP/release-notes.md"
      - name: Check both distribution links
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -Fq "[PyPI: tox-uv](https://pypi.org/project/tox-uv/${TAG}/)" "$RUNNER_TEMP/release-notes.md"
          grep -Fq "[PyPI: tox-uv-bare](https://pypi.org/project/tox-uv-bare/${TAG}/)" "$RUNNER_TEMP/release-notes.md"
          test "$(grep -Fc '**Full Changelog**:' "$RUNNER_TEMP/release-notes.md")" -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  github-draft:
    name: Stage GitHub Release
    needs: github-notes
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - uses: tox-dev/github-workflows/publish-github-release@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: stage
  stage:
    name: Check both PyPI distributions
    needs: [collect, github-notes, github-draft]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      bare-missing-count: ${{ steps.bare.outputs.missing-count }}
      meta-missing-count: ${{ steps.meta.outputs.missing-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Separate the PyPI project files
        run: |
          mkdir bare meta
          cp dist/tox_uv_bare-*.whl dist/tox_uv_bare-*.tar.gz bare/
          cp dist/tox_uv-*.whl meta/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        id: bare
        with:
          project: tox-uv-bare
          version: ${{ github.ref_name }}
          dist: bare
          mode: stage
          missing-dir: missing-bare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bare-pypi-missing-manifest
          path: ${{ steps.bare.outputs.manifest }}
          if-no-files-found: error
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        id: meta
        with:
          project: tox-uv
          version: ${{ github.ref_name }}
          dist: meta
          mode: stage
          missing-dir: missing-meta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta-pypi-missing-manifest
          path: ${{ steps.meta.outputs.manifest }}
          if-no-files-found: error
  release:
    name: Publish to PyPI
    needs: stage
    if: >-
      needs.stage.outputs.bare-missing-count != '0' || needs.stage.outputs.meta-missing-count != '0'
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox-uv/${{ github.ref_name }}
    permissions:
      id-token: write # Publish through PyPI's trusted publisher.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bare-pypi-missing-manifest
          path: ${{ runner.temp }}/bare-manifest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-pypi-missing-manifest
          path: ${{ runner.temp }}/meta-manifest
      - uses: tox-dev/github-workflows/select-pypi-artifacts@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          dist: dist
          manifest: ${{ runner.temp }}/bare-manifest/pypi-missing-names.txt
          output-dir: missing-bare
          expected-count: ${{ needs.stage.outputs.bare-missing-count }}
      - uses: tox-dev/github-workflows/select-pypi-artifacts@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          dist: dist
          manifest: ${{ runner.temp }}/meta-manifest/pypi-missing-names.txt
          output-dir: missing-meta
          expected-count: ${{ needs.stage.outputs.meta-missing-count }}
      - name: Collect files missing from PyPI
        run: |
          mkdir missing-dist
          find missing-bare missing-meta -maxdepth 1 -type f -exec cp --target-directory=missing-dist -- {} +
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: missing-dist
          skip-existing: true
  verify-pypi:
    name: Verify both PyPI distributions
    needs: [stage, release, github-draft]
    if: always() && needs.stage.result == 'success' && needs.github-draft.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.release.result)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Separate the PyPI project files
        run: |
          mkdir bare meta
          cp dist/tox_uv_bare-*.whl dist/tox_uv_bare-*.tar.gz bare/
          cp dist/tox_uv-*.whl meta/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          project: tox-uv-bare
          version: ${{ github.ref_name }}
          dist: bare
          mode: verify
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          project: tox-uv
          version: ${{ github.ref_name }}
          dist: meta
          mode: verify
  github-release:
    name: Publish GitHub Release
    needs: [verify-pypi, github-notes, github-draft]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write # Create or repair the GitHub Release after PyPI succeeds.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - uses: tox-dev/github-workflows/publish-github-release@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: publish
