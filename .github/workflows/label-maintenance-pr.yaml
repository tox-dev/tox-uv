name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
concurrency:
  group: label-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions: {}
jobs:
  label:
    name: Label bot maintenance PR
    runs-on: ubuntu-26.04
    permissions:
      issues: write # Labels are issue metadata.
      pull-requests: read # Inspect the PR author and changed paths.
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          fragments: changelog.d
