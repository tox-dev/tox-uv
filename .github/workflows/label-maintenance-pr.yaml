name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  label:
    runs-on: ubuntu-26.04
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@144f8e68b7d4c7c44e32258b1305e4402bc4e392
        with:
          fragments: changelog.d
